[package]
name = "codegen"
version = "0.1.0"
edition = "2024"
default-run = "generate"
publish = false

[dependencies]
anyhow = "1.0.104"
encoding_rs_io = "0.1.8"
lazy_static = "1.5.1"
nrbf = { version = "0.2", features = ["serde"] }
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.24.0", default-features = false, features = ["base64", "guide", "hex"] }
stringcase = "1.0.0"
